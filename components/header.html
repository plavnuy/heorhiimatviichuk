<script>
    document.getElementById('back-link')?.addEventListener('click', function(e) {
        e.preventDefault();
        
        // Проверяем, пришли ли мы из галереи (через sessionStorage)
        const shouldReturn = sessionStorage.getItem('gallery_return');
        
        if (shouldReturn === 'true') {
            const path = sessionStorage.getItem('gallery_path') || '/';
            const hash = sessionStorage.getItem('gallery_hash') || '';
            
            // Очищаем sessionStorage
            sessionStorage.removeItem('gallery_return');
            sessionStorage.removeItem('gallery_path');
            sessionStorage.removeItem('gallery_hash');
            
            // Возвращаемся в галерею с сохраненным фильтром
            window.location.href = path + hash;
        } 
        // Проверяем, есть ли referrer с нашего сайта
        else if (document.referrer && document.referrer.includes(window.location.hostname)) {
            window.location.href = document.referrer;
        } 
        // Если нет ни того, ни другого - значит пришли по прямой ссылке
        else {
            // Просто переходим на главную
            window.location.href = '/';
        }
    });

    // Дополнительно: при загрузке страницы проверяем, 
    // если нет gallery_return, значит пришли по прямой ссылке

</script>

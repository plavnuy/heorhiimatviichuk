.glitch3 span {

@keyframes glitch3 {
  0%,50%,100%{
  transform: skewX(0deg) translateX(0px) scale(1,1);
	  text-shadow: 0px 0 rgb(27, 27, 27);
    clip-path: none;
    
  }
  5%,15%,25%{

	   text-shadow: -2px 0px rgb(0, 0, 0), -3px 2px #0a0a0a;
    
  }

  }

  }

.cyber-x-grid {
	pointer-events: none;           /* чтоб не ловило клики */
	position: fixed;
	inset: 0;
	z-index: 2000;
	display: grid;
	grid-template-columns: repeat(auto-fill, var(--cell-size));
	grid-auto-rows: var(--cell-size);
	/* лёгкий поворот сетки, чтобы не было скучно */
	transform-origin: center center;
	opacity: 0.2; /* общая прозрачность слоя */
	filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.2));
}

/* каждая ячейка с X */
.cyber-x-grid span {
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: var(--font-size);
	line-height: 1;
	font-family: "JetBrains Mono", monospace;
	color: var(--overlay-color);

	/* лёгкий глитч шум через рандомную прозрачность (см. nth-child ниже) */
	transition: opacity .2s;
}

/* разнообразим прозрачность, выглядит как шум помех */

/* RESET */
* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
}

body {
  
	background-color: var(--bg);
	color: var(--text-main);
	font-family: system-ui, sans-serif;

	/* скролл нужен только ради прогресса анимации */
	min-height: 800vh;
}

/* ===== FIXED СЦЕНА НА ВСЮ ВЬЮШКУ ===== */
.tunnel-scene {
	position: fixed;
	inset: 0;
	perspective: calc(var(--persp-depth) * 1.0);
	overflow: hidden;
}

/* виньетки дают эффект тоннеля */
.tunnel-vignette {
	position: absolute;
	inset: 0;
	background: linear-gradient(
		rgb(0, 0, 0) 0%,
		rgba(72, 255, 0, 0) 5%,
    		rgba(72, 255, 0, 0) 40%,
		rgb(0, 0, 0) 30%,
    		rgb(0, 0, 0) 70%,
		rgb(0, 0, 0, 0) 80%,
		rgba(0, 0, 0, 0) 90%,
		rgb(0, 0, 0) 100%
	);
	z-index: 3;
	pointer-events: none;
}


.logo {

	height: 28px;


}



/* ===== СЕТКИ: ПОЛ И ПОТОЛОК ===== */
.grid-plane {
  
	position: absolute;
	left: 50%;
	width: 150%;
	height: 40%;
	transform-origin: 0% 50%;
	background-size:
		/* вертикальные линии */
		10vw 10vw,
		/* горизонтальные линии */
		10vh 5vh;
	background-image:
		linear-gradient(
			to right,
			var(--grid-color) 0px,
			var(--grid-color) 2px,
			transparent 1px
		),
		linear-gradient(
			to top,
			var(--grid-color) 0px,
			var(--grid-color) 2px,
			transparent 1px
		);
	opacity: 0.6;
		pointer-events: none;
}


/* потолок уходит вперёд */
.grid-top {
	top: 30%;
	transform:
		translate(-50%, -100%)
		rotateX(-90deg)
		translateZ(calc(var(--persp-depth) * -0.8));
	z-index: 1;
}

/* пол уходит вперёд */
.grid-bottom {
	bottom: -10%;
	transform:
		translate(-50%, 0%)
		rotateX(90deg)
		translateZ(calc(var(--persp-depth) * -0.8));
	z-index: 1;
}

/* ===== СЛАЙДЕР В ПРОСТРАНСТВЕ ===== */
.slider {
  
	position: absolute;
	inset: 0;
	pointer-events: none;
	perspective: 1000px;
	z-index: 5;
	transform-style: preserve-3d;
	will-change: transform;
}

.slide {
    position: absolute;
    isolation: isolate;     
    min-width: var(--slide-w);
    max-width: var(--slide-w);

    color: var(--text-main);
    background: var(--slide-bg);

    border-radius: var(--slide-radius);
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    padding: 1rem 1rem .75rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;

    box-shadow:
        0 0 80px rgba(0, 0, 0, 0.5);
        

    font-size: .8rem;
    line-height: 1.4;

    transform-style: preserve-3d;
    will-change: transform, opacity;

    /* ← ключевое */
    pointer-events: auto;

    /* для плавной анимации ховера */
    transition: outline 0.25s ease,
                outline-offset 0.25s ease,
                box-shadow 0.25s ease;
    

}

/* ХОВЕР */
.slide:hover{ outline: none; 
color:#00fff9;
    box-shadow:
        0px 0px 2px rgba(255, 255, 255, 0.424);

}


.slide::after{
  content: "";
  position: absolute;
  inset: calc(var(--ring-offset) * -1);
  padding: var(--ring-width);
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s ease, filter .2s ease;

  /* радужный градиент, направление — по углу мыши */
  background:
    conic-gradient(
      from var(--angle)
      at calc(50% + var(--mx)*12%) calc(50% + var(--my)*10%),
      #000000, #000000, #f9f9f9, #000000, #f9f9f9, #000000
    );

  /* делаем «кольцо» через маску (только рамка, без заливки центра) */
mask:
  linear-gradient(#000 0 0) content-box,
  linear-gradient(#000 0 0);
-webkit-mask:
  linear-gradient(#000 0 0) content-box,
  linear-gradient(#000 0 0);

mask-composite: exclude;
-webkit-mask-composite: xor;


}

.slide:hover::after{
  opacity: 1;

}

/* внешняя "рамка" — это кнопка/контейнер с фоном-рамкой */
.notch-btn-outer{
  --a: var(--notch);
  --b: var(--border);
  display: inline-block;
  padding: var(--b);               /* толщина рамки видима как фон контейнера */
  background: var(--border-color); /* цвет рамки */
  cursor: pointer;
  /* форма рамки */
  clip-path: polygon(
    0px var(--a),
    var(--a) 0px,
    100% 0px,
    100% calc(100% - var(--a)),
    calc(100% - var(--a)) 100%,
    0px 100%,
    0px var(--a)
  );
  border: none;
  line-height: 0; /* чтобы span не добавлял высоту */
  transition: transform .18s ease, box-shadow .18s ease;
}

/* внутренняя кнопка — фактическая поверхность, прозрачная по умолчанию */
.notch-btn-inner{
  --a: calc(var(--notch) - var(--border)); /* подогнать срез внутри */
  display: inline-block;
  font-size: 24px;
  padding: 18px 60px;
  background: transparent;
  color: var(--border-color);
  text-align: center;
  user-select: none;
  /* внутренняя форма — сдвинутая на толщину рамки (чтобы совпадало визуально) */
  clip-path: polygon(
    2px calc(var(--a) + 34px), /* в polygon можно подбирать мелкие корректировки; ниже - упрощение */
    37px 2px,
    calc(100% - 2px) 2px,
    calc(100% - 2px) calc(100% - calc(var(--a) + 34px)),
    calc(100% - var(--a)) calc(100% - 2px),
    2px calc(100% - 2px),
    2px calc(var(--a) + 34px)
  );
  transition: color .18s ease, box-shadow .18s ease, transform .18s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* hover — меняем только цвет рамки и текста (фон внутреннего остаётся прозрачным) */
.notch-btn-outer:hover{

// ---- Helper: decode/encode one element, возвращают Promise ----
function decodeElement(el, opts = {}) {
  // el: контейнер, внутри .hack-current и .hack-final
  // opts: { chars, chanceScale, frameMs } - можно не передавать
  return new Promise((resolve) => {
    if (!el) return resolve();

    const curr = el.querySelector('.hack-current');
    const fin = el.querySelector('.hack-final');
    const finalText = el.getAttribute('data-final') || fin?.textContent || '';

    if (!curr || !fin) {
      // nothing to animate
      if (fin) fin.style.display = 'inline-block';
      return resolve();
    }

    // cancel prev raf for this element (if any)
    const key = el;
    if (activeAnims.has(key)) {
      const prev = activeAnims.get(key);
      cancelAnimationFrame(prev);
      activeAnims.delete(key);
    }

    curr.style.display = 'inline-block';
    fin.style.display = 'none';
    curr.classList.remove('hack-hidden');
    fin.classList.add('hack-hidden');

    const chars = opts.chars || "!<>-_\\/[]{}#%&$?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const chanceScale = opts.chanceScale || 20;

    const letters = finalText.split("").map(ch => ({ final: ch, done: ch === " " }));

    let frame = 0;

    function tick() {
      let out = "";
      let complete = 0;

      for (let i = 0; i < letters.length; i++) {
        if (letters[i].done) {
          out += letters[i].final;
          complete++;
        } else {
          out += chars[Math.floor(Math.random() * chars.length)];
          if (Math.random() < frame / chanceScale) {
            letters[i].done = true;
          }
        }
      }

      curr.textContent = out;
      frame++;

      if (complete < letters.length) {
        const rafId = requestAnimationFrame(tick);
        activeAnims.set(key, rafId);
      } else {
        // show final
        curr.style.display = 'none';
        fin.style.display = 'inline-block';
        curr.classList.add('hack-hidden');
        fin.classList.remove('hack-hidden');
        activeAnims.delete(key);
        resolve();
      }
    }

    tick();
  });
}

function encodeElement(el, opts = {}) {
  return new Promise((resolve) => {
    if (!el) return resolve();

    const curr = el.querySelector('.hack-current');
    const fin = el.querySelector('.hack-final');
    const finalText = el.getAttribute('data-final') || fin?.textContent || '';

      activeAnims.delete(key);

    fin.style.display = 'none';

    let frame = 0;
    const maxFrames = opts.maxFrames || 20;

    function tick() {
      let out = "";
      for (let i = 0; i < finalText.length; i++) {
        const ch = finalText[i];
        out += (ch === " ") ? " " : chars[Math.floor(Math.random() * chars.length)];
      }
      curr.textContent = out;
      frame++;

      if (frame < maxFrames) {
        const rafId = requestAnimationFrame(tick);
        activeAnims.set(key, rafId);
      } else {
        // hide noise layer (assume .hack-hidden has CSS transition if desired)
        curr.classList.add('hack-hidden');
        setTimeout(() => {
          curr.style.display = 'none';
          // keep fin hidden (since encode means disappear)
          activeAnims.delete(key);
          resolve();
        }, opts.fadeDelay || 160);
      }
    }

    tick();
  });
}

// ---- animateDecode: title -> subtitle ----
async function animateDecode(cardEl) {
  const st = cardEl.dataset.state;
  if (st === "decoding" || st === "decoded") return;
  cardEl.dataset.state = "decoding";

  // cancel any previous rafs for card-level keys
  if (activeAnims.has(cardEl)) {
    const prev = activeAnims.get(cardEl);
    if (Array.isArray(prev)) prev.forEach(id => cancelAnimationFrame(id));
    else cancelAnimationFrame(prev);
    activeAnims.delete(cardEl);
  }

  const titleEl = cardEl.querySelector('.card-title');
  const subtitleEl = cardEl.querySelector('.card-subtitle');

  if (!titleEl) {
    cardEl.dataset.state = 'decoded';
    return;
  }

  // decode title first
  await decodeElement(titleEl, { chanceScale: 20 });

  // then decode subtitle (if exists)
  if (subtitleEl) {
    // ensure subtitle has proper spans; if not, skip
    const subCurr = subtitleEl.querySelector('.hack-current');
    const subFin = subtitleEl.querySelector('.hack-final');
    if (subCurr && subFin) {
      await decodeElement(subtitleEl, { chanceScale: 16, chars: "!<>-_\\/[]{}#%&$?abcdefghijklmnopqrstuvwxyz0123456789" });
    }
  }

  cardEl.dataset.state = 'decoded';
}

// ---- animateEncode: subtitle -> title ----
async function animateEncode(cardEl) {
  const st = cardEl.dataset.state;
  if (st === "encoding" || st === "encoded") return;
  cardEl.dataset.state = "encoding";

  // cancel any previous rafs for card-level keys
  if (activeAnims.has(cardEl)) {
    const prev = activeAnims.get(cardEl);
    if (Array.isArray(prev)) prev.forEach(id => cancelAnimationFrame(id));
    else cancelAnimationFrame(prev);
    activeAnims.delete(cardEl);
  }

  const titleEl = cardEl.querySelector('.card-title');
  const subtitleEl = cardEl.querySelector('.card-subtitle');

  // encode subtitle first (if exists)
  if (subtitleEl) {
    const subCurr = subtitleEl.querySelector('.hack-current');
    const subFin = subtitleEl.querySelector('.hack-final');
    if (subCurr && subFin) {
      await encodeElement(subtitleEl, { maxFrames: 14, fadeDelay: 140 });
    }
  }

  // then encode title
  if (titleEl) {
    const tCurr = titleEl.querySelector('.hack-current');
    const tFin = titleEl.querySelector('.hack-final');
    if (tCurr && tFin) {
      await encodeElement(titleEl, { maxFrames: 20, fadeDelay: 180 });
    }
  }

  cardEl.dataset.state = 'encoded';
}

function smoothstep(t) {
    return t * t * (3 - 2 * t);
}

function snappedProgress(progressRaw, stickiness = 0.7) {
    const total = slidesData.length - 1;
    if (total <= 0) return 0;

    const idxFloat = progressRaw * total;
    const idxNearest = Math.round(idxFloat);
    const dist = idxFloat - idxNearest; // -0.5 .. 0.5
    const absDist = Math.abs(dist);

    let snappedIdxFloat;

    if (absDist < stickiness / 2) {
        // ближе к центру карточки — держим её
        const localT = absDist / (stickiness / 2); // 0..1
        const pull = 1 - smoothstep(localT);       // 1..0
        snappedIdxFloat = idxNearest + dist * (1 - pull);
    } else {
        // далеко — свободный дрейф
        snappedIdxFloat = idxFloat;
    }

    let snapped = snappedIdxFloat / total;
    if (snapped < 0) snapped = 0;
    if (snapped > 1) snapped = 1;
    return snapped;
}


/* ============ 4. Рендер цикла полёта ============ */
function renderFrame() {
	// прогресс прокрутки [0..1]
const progressRaw = maxScroll > 0 ? (scrollPos / maxScroll) : 0;
const progress = snappedProgress(progressRaw, 0.7); // 0.7 = сколько "липнет"

// дальше как раньше:
const totalDepth = (slidesData.length - 1) * Z_GAP;
const cameraZ = -START_OFFSET + progress * (totalDepth + START_OFFSET);


	// сила параллакса
	const PARALLAX_POWER_X = 5; // vw
	const PARALLAX_POWER_Y = 3; // vh

slidesEls.forEach(slide => {
  const baseZ = parseFloat(slide.dataset.baseZ);
  const relativeZ = baseZ - cameraZ;

  // если слайд слишком позади или слишком впереди — прячем и делаем неинтерактивным
  if (relativeZ < -300 || relativeZ > 2000) {
    slide.style.opacity = 0;
    slide.style.filter = "none";
    slide.style.pointerEvents = "none"; // <-- ОСТАВЛЯЕМ none для скрытых слайдов
    return;
  }

  // видимая ветка — сначала вычисления...
  const dist = Math.abs(relativeZ);

  // opacity
  let vis = 1 - dist / 300;
  vis = Math.max(0, Math.min(1, vis));

  // scale
  let sc = 1.2 - (dist / 400) * 0.8;
  if (sc < 0) sc = 0.4;
  if (sc > 1.2) sc = 1.2;

  // параллакс от мыши
  const parallaxXvw = mouseNX * PARALLAX_POWER_X;
  const parallaxYvh = mouseNY * PARALLAX_POWER_Y;

  // поворот камеры
  const rotY = mouseNX * 5;   // deg
  const rotX = mouseNY * -3;  // deg

  // depth of field blur
  const FOCUS_DISTANCE = 30;
  const SHARP_RANGE = 30;
  const d = Math.abs(dist - FOCUS_DISTANCE);

  let blurPx = 0;
  if (d > SHARP_RANGE) {
    blurPx = (d - SHARP_RANGE) / 20;
    if (blurPx > 30) blurPx = 40;
  }

  // применяем трансформы и визуальные свойства
  slide.style.transform = `
    translate3d(${parallaxXvw}vw, ${parallaxYvh}vh, ${-relativeZ}px)
    rotateY(${rotY}deg)
    rotateX(${rotX}deg)
    scale(${sc})
  `;
  slide.style.opacity = vis;
  slide.style.filter = blurPx > 0 ? `blur(${blurPx}px)` : "none";

  // **ВАЖНО: явно включаем pointer-events для видимого слайда**
  // делаем это после того, как применили transform/opacity — так точно не останется старое значение
  slide.style.pointerEvents = 'auto';

  // логика дешифровки/зашифровки (как у тебя)
  if (sc >= 1.1) {
    const st = slide.dataset.state;
    if (st === "encoded" || st === "encoding") {
      animateDecode(slide);
    }
  } else if (sc < 1.05) { // порог подбери по вкусу (не sc < 2)
    const st = slide.dataset.state;
    if (st === "decoded" || st === "decoding") {
      animateEncode(slide);
    }
  }
});


	requestAnimationFrame(renderFrame);
}
